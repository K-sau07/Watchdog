# Render Blueprint — New → Blueprint → point at this repo.
# Free tier: the service sleeps after ~15 min idle and cold-starts in ~50s.
services:
  - type: web
    name: watchdog-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Paste the Neon connection string in the Render dashboard — never commit it.
      # Use the DIRECT endpoint (host WITHOUT -pooler). The pooled endpoint drops the
      # SET search_path that pins this service to its own schema, which fails
      # intermittently at runtime. See application-prod.yml for the full note.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Upstash rediss:// URL — ShedLock needs it, the poll won't start without it.
      - key: REDIS_URL
        sync: false
