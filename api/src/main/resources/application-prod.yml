# Production profile. Everything sensitive comes from the environment — nothing
# secret is committed. Render injects PORT; the datasource points at Neon.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Neon's free tier is modest and the service is single-user; a small pool
      # avoids exhausting connection limits during a cold start.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      # Set the schema on the pool rather than via currentSchema in the JDBC URL —
      # Neon's pooled endpoint doesn't honour the URL parameter, so runtime queries
      # fell back to public and couldn't see the tables Flyway had created.
      #
      # DB_URL must be Neon's DIRECT endpoint, not the -pooler one. Hikari applies
      # this schema by issuing SET search_path on each connection, and Neon's pooler
      # multiplexes connections per transaction, so the SET is silently lost on some
      # of them. The failure is intermittent, which is worse than a clean error:
      # /api/postings returned 200 while /api/agent/status 500'd, and the boot-time
      # seeder died with relation "company" does not exist while the tables existed.
      schema: ${DB_SCHEMA:watchdog}
  flyway:
    enabled: true
    baseline-on-migrate: true
    # One Neon database is shared across projects, so pin Flyway to this
    # project's schema. Without these it ignores currentSchema and writes to
    # public, where every service would collide.
    schemas: ${DB_SCHEMA:watchdog}
    default-schema: ${DB_SCHEMA:watchdog}
    create-schemas: true
  data:
    redis:
      # Required — ShedLock uses Redis so the poll cycle runs on exactly one
      # instance (SchedulingConfig). Upstash gives a rediss:// URL.
      url: ${REDIS_URL}

server:
  port: ${PORT:8080}


watchdog:
  cors:
    # The Vercel dashboard origin(s), comma-separated. Set in the Render dashboard.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  polling:
    enabled: ${POLLING_ENABLED:true}
    interval-ms: ${POLL_INTERVAL_MS:3600000}

logging:
  level:
    root: INFO
    com.watchdog: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
