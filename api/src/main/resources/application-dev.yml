spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchdog}
    username: ${DB_USER:watchdog}
    password: ${DB_PASSWORD:watchdog}
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

watchdog:
  polling:
    enabled: true
    interval-ms: 3600000  # D-WD19: hourly background poll (was 2min) to avoid ATS bot-blocks; on-demand refresh covers active hunting
