# S0 test profile: no live database yet.
# We exclude datasource/JPA/Flyway auto-config so the context loads
# without Postgres. S2 introduces Testcontainers for real persistence tests
# and this exclusion goes away.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jpa.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
